trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  IMAGE_NAME: 'my-app-image'

steps:

# 🔹 Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# 🔹 Debug
- script: ls -la
  displayName: 'Debug: List files'

# 🔹 Install dependencies
- script: npm install
  displayName: 'Install dependencies'

# 🔹 Install frontend dependencies (if exists)
- script: |
    if [ -d "frontend" ]; then
      cd frontend
      npm install
      cd ..
    fi
  displayName: 'Install frontend dependencies'

# 🔹 Build frontend
- script: |
    npm run build:frontend || echo "Skipping frontend build"
  displayName: 'Build frontend'

# 🔹 Build backend
- script: |
    npm run build:server || echo "Skipping backend build"
  displayName: 'Build backend'

# 🔹 🔐 SCA Scan (Dependencies)
- script: |
    npx snyk test --severity-threshold=high
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk SCA Scan (Fail if High > 0)'

# 🔹 🔍 SAST Scan (Code)
- script: |
    npx snyk code test --severity-threshold=high
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk SAST Scan (Fail if High > 0)'

# 🔹 🐳 Build Docker Image
- script: |
    docker build -t $(IMAGE_NAME):latest .
  displayName: 'Build Docker Image'

# 🔹 🐳 Container Scan
- script: |
    npx snyk container test $(IMAGE_NAME):latest --severity-threshold=high
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Container Scan (Fail if High > 0)'

# 🔹 📊 Publish Results to Snyk
- script: |
    npx snyk monitor
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Publish Results to Snyk'
  condition: succeededOrFailed()