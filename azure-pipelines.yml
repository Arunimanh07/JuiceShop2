trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# Checkout repository
- checkout: self
  fetchDepth: 0

# Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# Debug manifests
- script: |
    echo "Repository Structure"
    find . -maxdepth 4

    echo "Finding manifests..."
    find . -name "package.json"
    find . -name "Dockerfile"
    find . -name "*.tf"
    find . -name "*.yaml"
    find . -name "*.yml"
  displayName: 'Debug Repository'

# Install dependencies
- script: |
    npm install
  displayName: 'Install dependencies'

# Build application
- script: |
    npm run build || echo "Skipping build"
  displayName: 'Build application'

# Verify Docker
- script: |
    docker --version
  displayName: 'Check Docker'

# Build Docker Image
- script: |
    docker build -t juice-shop-demo .
  displayName: 'Build Docker Image'

# Install Snyk CLI
- script: |
    npm install -g snyk
  displayName: 'Install Snyk'

# Authenticate Snyk
- script: |
    snyk auth $(SNYK_TOKEN)
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Authenticate Snyk'

# OSS Scan
- script: |
    snyk test \
      --all-projects \
      --detection-depth=5 \
      --severity-threshold=high \
      --exclude=licenses \
      || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk OSS Scan'

# OSS Monitor
- script: |
    snyk monitor \
      --all-projects \
      --detection-depth=5 \
      || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk OSS Monitor'

# IaC Scan
- script: |
    snyk iac test . || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk IaC Scan'

# Container Scan
- script: |
    snyk container test juice-shop-demo --file=Dockerfile || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Container Scan'

# Container Monitor
- script: |
    snyk container monitor juice-shop-demo --file=Dockerfile || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Container Monitor'