trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# Install dependencies
- script: |
    npm install
  displayName: 'Install dependencies'

# Build application
- script: |
    npm run build || echo "Skipping build"
  displayName: 'Build application'

# Verify Docker
- script: |
    docker --version
  displayName: 'Check Docker'

# Build Docker Image
- script: |
    docker build -t juice-shop-demo .
  displayName: 'Build Docker Image'

# Install Snyk CLI
- script: |
    npm install -g snyk
  displayName: 'Install Snyk'

# Authenticate Snyk
- script: |
    snyk auth $(SNYK_TOKEN)
  displayName: 'Authenticate Snyk'

# Open Source Scan
- script: |
    snyk test --severity-threshold=high
  displayName: 'Snyk OSS Scan'

# Container Scan
- script: |
    snyk container test juice-shop-demo --file=Dockerfile
  displayName: 'Snyk Container Scan'

# Monitor
- script: |
    snyk container monitor juice-shop-demo --file=Dockerfile
  displayName: 'Snyk Monitor'