trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  SNYK_TOKEN:snyk_cs_TD6if_pkh2B_4_srXlpZBJWcJK2YKywSePjHWhsdcq4__v1

steps:

# 🔹 Install Node (required for Snyk CLI)
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# 🔹 Install Snyk CLI
- script: |
    npm install -g snyk
  displayName: 'Install Snyk CLI'

# 🔹 Authenticate Snyk
- script: |
    snyk auth:snyk_cs_TD6if_pkh2B_4_srXlpZBJWcJK2YKywSePjHWhsdcq4__v1
  displayName: 'Authenticate with Snyk'

# 🔹 Run Snyk Scan (FAIL if HIGH vulnerabilities exist)
- script: |
    snyk test --severity-threshold=high
  displayName: 'Run Snyk Test (High Threshold)'

# 🔹 Optional: Monitor project in Snyk dashboard
- script: |
    snyk monitor
  displayName: 'Monitor Project in Snyk'
  condition: succeededOrFailed()
