trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# Checkout repository
- checkout: self
  fetchDepth: 0

# Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# Debug repository structure
- script: |
    echo "Current Directory:"
    pwd

    echo "Repository Structure:"
    find . -maxdepth 4

    echo "Searching manifests..."
    find . -name "package.json"
    find . -name "Dockerfile"
    find . -name "*.tf"
    find . -name "*.yaml"
    find . -name "*.yml"
  displayName: 'Debug Repository'

# Install dependencies
- script: |
    npm install
  displayName: 'Install Dependencies'

# Install frontend dependencies if present
- script: |
    if [ -f "frontend/package.json" ]; then
      cd frontend
      npm install
    else
      echo "No frontend package.json found"
    fi
  displayName: 'Install Frontend Dependencies'

# Build application
- script: |
    npm run build || echo "Skipping root build"

    if [ -f "frontend/package.json" ]; then
      cd frontend
      npm run build || echo "Skipping frontend build"
    fi
  displayName: 'Build Application'

# Verify Docker
- script: |
    docker --version
  displayName: 'Check Docker'

# Install Snyk CLI
- script: |
    npm install -g snyk
  displayName: 'Install Snyk CLI'

# Authenticate Snyk
- script: |
    snyk auth $(SNYK_TOKEN)
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Authenticate Snyk'

# =========================
# OPEN SOURCE SCAN
# =========================
- script: |
    snyk test \
      --all-projects \
      --detection-depth=5 \
      --severity-threshold=high \
      --exclude=licenses \
      || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Open Source Scan'

# OSS Monitor
- script: |
    snyk monitor \
      --all-projects \
      --detection-depth=5 \
      || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk OSS Monitor'

# =========================
# SNYK CODE (SAST)
# =========================
- script: |
    snyk code test || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Code Scan'

# =========================
# IaC SCAN
# =========================
- script: |
    snyk iac test . || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk IaC Scan'

# =========================
# BUILD DOCKER IMAGE
# =========================
- script: |
    docker build -t juice-shop-demo .
  displayName: 'Build Docker Image'

# =========================
# CONTAINER SCAN
# =========================
- script: |
    snyk container test juice-shop-demo --file=Dockerfile || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Container Scan'

# Container Monitor
- script: |
    snyk container monitor juice-shop-demo --file=Dockerfile || true
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Container Monitor'