trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# Install dependencies
- script: |
    npm install
  displayName: 'Install dependencies'

# Build application
- script: |
    npm run build || echo "Skipping build"
  displayName: 'Build application'

# Install Docker
- task: DockerInstaller@0
  inputs:
    dockerVersion: 'latest'

# Build Docker Image
- script: |
    docker build -t juice-shop-demo .
  displayName: 'Build Docker Image'

# Install Snyk
- script: |
    npm install -g snyk
  displayName: 'Install Snyk CLI'

# Snyk Open Source Scan
- script: |
    snyk test --severity-threshold=high
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Open Source Scan'

# Snyk Container Scan
- script: |
    snyk container test juice-shop-demo --file=Dockerfile
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Snyk Container Scan'

# Monitor Container
- script: |
    snyk container monitor juice-shop-demo --file=Dockerfile
  env:
    SNYK_TOKEN: $(SNYK_TOKEN)
  displayName: 'Monitor Container'